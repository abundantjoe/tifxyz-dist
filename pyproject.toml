[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tifxyz-dist"
version = "0.1.0"
description = "Exact, certified point-to-surface and surface-to-surface distances for tifxyz meshes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "tifffile", "imagecodecs"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tifxyz-dist = "tifxyz_dist.cli:main"

[tool.setuptools]
packages = ["tifxyz_dist"]
